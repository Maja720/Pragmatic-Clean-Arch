services:
  bookify.api:
    image: ${DOCKER_REGISTRY-}bookifyapi
    container_name: Bookify.Api
    build:
      context: .
      dockerfile: Bookify.Api/Dockerfile
    depends_on:
      - bookify-db

  bookify-db:
    image: postgres:16
    container_name: Bookify.Db
    environment:
      - POSTGRES_DB=bookify
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=maja
    volumes:
      - ./.containers/database:/var/lib/postgresql
    ports:
      - 5432:5432

  bookify-idp:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: Bookify.Identity
    command: start-dev --import-realm
    environment:
    - KEYCLOAK_ADMIN=admin
    - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
    - ./.containers/identity:/opt/keycloak/data
    - ./.files/bookify-realm-export.json:/opt/keycloak/data/import/realm.json
    ports:
    - 18080:8080

  bookify-seq:
    image: datalust/seq:latest
    container_name: Bookify.Seq
    environment:
    - ACCEPT_EULA=Y
    - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
    - 5341:5341
    - 8081:80 
    volumes:
    - ./.containers/seq:/data
